name: Immersion motion build and verification
on:
  push:
    branches: [main]
    paths:
      - 'development/immersion/**'
      - 'projects/grilling/integration/immersion_lab/**'
      - '.github/transport/immersion-a115-*.b64'
  pull_request:
    paths:
      - 'development/immersion/**'
      - 'projects/grilling/integration/immersion_lab/**'
      - '.github/transport/immersion-a115-*.b64'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grilling-immersion-build
  cancel-in-progress: false
jobs:
  immersion:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Expand locally tested source only after checksum verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64,hashlib,io,tarfile
          pieces=[Path('.github/transport/immersion-a115-'+str(i)+'.b64') for i in range(2)]
          if any(p.exists() for p in pieces):
              raw=base64.b64decode(''.join(''.join(p.read_text().split()) for p in pieces),validate=True)
              assert hashlib.sha256(raw).hexdigest()=='8695a2270206375db6f3503302a7ea51c8cf0e3f0426c442b1ce5666e09c6333','Source transport checksum mismatch'
              allowed={'build.py','flow.js','main.js','package.json','preview.py','test.mjs','test_runtime.mjs','verify.py'}
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:xz') as tar:
                  members=tar.getmembers()
                  assert len(members)==8 and sum(x.size for x in members)<150000
                  assert {PurePosixPath(x.name).name for x in members}==allowed
                  for x in members:
                      p=PurePosixPath(x.name)
                      assert x.isfile() and p.parts[:2]==('development','immersion') and len(p.parts)==3
                      destination=Path(*p.parts)
                      assert not destination.exists(),'Will not overwrite existing authoring source'
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      destination.write_bytes(tar.extractfile(x).read())
          else:
              assert Path('development/immersion/build.py').is_file(),'No tested authoring source found'
          PY
      - name: Install rendering dependencies
        run: python -m pip install 'numpy==2.3.5' 'Pillow==12.3.0'
      - name: Fetch fixed original source snapshot and verified official compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force work | Out-Null
          Invoke-WebRequest 'https://codeload.github.com/breezeth-CN/KaleidoscopeGrilling/zip/9a1acdab27698457bec16c9362678e574895a28c' -OutFile work/upstream.zip
          Expand-Archive work/upstream.zip work -Force
          $dash = Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }
      - name: Build actual scenes and compare animated poses and event behavior
        shell: pwsh
        run: |
          python development/immersion/build.py --upstream work/KaleidoscopeGrilling-9a1acdab27698457bec16c9362678e574895a28c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/immersion/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile the NEW immersion BP and RP using official Dash
        working-directory: projects/grilling/integration/immersion_lab
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare real compiled output including audio and license notices
        run: python development/immersion/verify.py --compiled
      - name: Create reusable authoring and review artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,shutil,os
          lab=Path('projects/grilling/integration/immersion_lab')
          report=Path('projects/grilling/reports/immersion_a115')
          with zipfile.ZipFile('artifacts/Grilling_Immersion_Lab_A1.15.brproject','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(lab.rglob('*')):
                  if p.is_file() and not set(p.relative_to(lab).parts)&{'builds','.bridge','__pycache__'}: z.write(p,p.relative_to(lab).as_posix())
          for name in ['index.html','flip.gif','brush.gif','season.gif','eat.gif','verification.json','dash-verification.json','pack-references.json']:
              shutil.copyfile(report/name,Path('artifacts')/('Grilling_A1.15_'+name))
          source={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('development/immersion').iterdir() if p.is_file()}
          (report/'authoring-sha256.json').write_text(json.dumps(source,indent=2)+'\n')
          summary={'tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'source_equations_and_models_verified':True,'dash_compiled_and_compared':True,'minecraft_tested':False,'native_player_retargeting_complete':False}
          (report/'ci-result.json').write_text(json.dumps(summary,indent=2)+'\n')
          for p in list(lab.rglob('__pycache__'))+list(Path('development/immersion').rglob('__pycache__')):shutil.rmtree(p)
          for p in [lab/'builds',lab/'.bridge']:
              if p.exists():shutil.rmtree(p)
          PY
      - name: Export verified test pack and review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Grilling-Immersion-A1.15
          path: |
            artifacts/Grilling_Immersion_Lab_A1.15.*
            artifacts/Grilling_A1.15_*
          retention-days: 14
          if-no-files-found: error
