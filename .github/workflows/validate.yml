name: Validate Grilling
on:
  push:
    paths:
      - 'notebook/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'notebook/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact public commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'burnt-tea-dev/kaleidoscope-grilling-unofficial'
          git init .
          git remote add origin https://github.com/burnt-tea-dev/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify repository guard
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const x=JSON.parse(fs.readFileSync('.repo-target.json')); if(x.repository!=='burnt-tea-dev/kaleidoscope-grilling-unofficial'||x.repository_id!==1377218440)process.exit(1)"
      - name: Notebook tests (mock player storage, not Minecraft)
        run: node notebook/test.mjs
