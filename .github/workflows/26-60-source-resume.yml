name: Resume exact 26.60 source application
on:
  push:
    branches: [feat/26-60-native-work-audio]
    paths: [.github/workflows/26-60-source-resume.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: feat/26-60-native-work-audio
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Recover original exact patch and run unchanged checks
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib,subprocess,textwrap
          p=pathlib.Path('.github/workflows/26-60-source-apply.yml')
          source=p.read_text()
          encoded=source.split('PATCH_DATA: >-\n',1)[1].split('\n        shell:',1)[0].strip()
          for bad,good in [('Z1ObnmcX+FH4as','Z1Obnmc+FH4as'),('ZH3xCGJ/5zE+/SeFV','ZH3xCGJ/5zE/SeFV')]:
              assert encoded.count(bad)==1
              encoded=encoded.replace(bad,good)
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='a1cf4889779f59fb649defa25653d48d7d86e9d9b101e5b207aa3762f6162365'
          script=textwrap.dedent(source.split('        run: |\n',1)[1].split('\n      - uses:',1)[0])
          old='test "$(git rev-parse HEAD^)" = 1279162e632c7ae3e556c18503adf0919267ced5'
          assert old in script
          script=script.replace(old,'git merge-base --is-ancestor 1279162e632c7ae3e556c18503adf0919267ced5 HEAD')
          pathlib.Path('.github/workflows/26-60-source-resume.yml').unlink()
          subprocess.run(['bash','-euo','pipefail','-c',script],env={**os.environ,'PATCH_DATA':encoded},check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grilling-26-60-source-delta
          path: ${{ runner.temp }}/grilling-26-60.bundle
          retention-days: 1
          if-no-files-found: error
