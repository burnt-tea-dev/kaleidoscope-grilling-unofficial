# Temporary read-only verification to compute the canonical candidate fingerprint.
# Remove before review/merge; this workflow has no write permissions.
name: T3.3 temporary source fingerprint and regression probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository_id == '1377218440'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate actual BP/RP runtime source fingerprints
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.baseline_gate import fingerprint, ROOT
          b=json.loads((ROOT/'baseline.json').read_text(encoding='utf-8'))
          print('T33_FINGERPRINT='+json.dumps({side:fingerprint(ROOT/path)[0] for side,path in b['runtime'].items()},sort_keys=True))
          PY
      - name: Run revised isolated cuisine contract tests
        run: node --import ./tests/helpers/register-minecraft-loader.mjs --test tests/legacy/test_a2750_core.mjs tests/legacy/test_cookery_output_contract_core.mjs
      - name: Negative control on unchanged base runtime
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cp tests/legacy/test_cookery_output_contract_core.mjs "$RUNNER_TEMP/cuisine-regression.mjs"
          git worktree add -q "$RUNNER_TEMP/grilling-base" "$BASE_SHA"
          cp "$RUNNER_TEMP/cuisine-regression.mjs" "$RUNNER_TEMP/grilling-base/tests/legacy/test_cookery_output_contract_core.mjs"
          cd "$RUNNER_TEMP/grilling-base"
          if node --import ./tests/helpers/register-minecraft-loader.mjs --test tests/legacy/test_cookery_output_contract_core.mjs; then
            echo 'ERROR: baseline did not reproduce original wrong-owner item mutation'
            exit 1
          fi
          echo 'EXPECTED_BASELINE_FAILURE=confirmed (not BDS or client)'
