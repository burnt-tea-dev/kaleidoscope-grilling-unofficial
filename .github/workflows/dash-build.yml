name: Real bridge Dash build
on:
  push:
    paths:
      - '.github/workflows/dash-build.yml'
      - 'projects/grilling/config.json'
      - 'projects/grilling/resource_pack/**'
      - 'development/verify_dash_outputs.py'
      - 'development/test_verify_dash_outputs.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dash:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Read exact public commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'burnt-tea-dev/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git remote add origin https://github.com/burnt-tea-dev/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Download and verify official Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $path
          $expected = '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de'
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Dash executable checksum mismatch' }
      - name: Compile cumulative asset resource pack
        working-directory: projects/grilling
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The standalone Cookery106 chapter was retired in a0218906. The guide
      # is compiled with the existing product by bridge-project/gameplay CI.
      - name: Exercise asset export failure guards
        shell: pwsh
        run: |
          python development/test_verify_dash_outputs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual compiled files
        shell: pwsh
        run: |
          python development/verify_dash_outputs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
