name: Offline world ID census

on:
  push:
    branches: [main]
    paths: ['tools/ops/**', 'tools/guards/test_guards.py', '.github/workflows/world-census.yml']
  pull_request:
    paths: ['tools/ops/**', 'tools/guards/test_guards.py', '.github/workflows/world-census.yml']

permissions:
  contents: read

concurrency:
  group: grilling-world-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    name: Offline census synthetic behavior
    if: github.repository_id == '1377218440'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CENSUS_RUNTIME: ${{ runner.temp }}/grilling-census
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the exact native build tool
        run: python3 -m pip install --only-binary=:all: --require-hashes -r tools/ops/build-requirements.txt
      - name: Keep generated dependencies outside the source checkout
        run: |
          mkdir "$CENSUS_RUNTIME"
          cp tools/ops/world_ids.py tools/ops/world_ids.mjs tools/ops/world_nbt.mjs tools/ops/world_properties.mjs tools/ops/package.json tools/ops/package-lock.json tools/ops/build-requirements.txt "$CENSUS_RUNTIME/"
      - name: Install locked low-level DB and NBT libraries without lifecycle scripts
        run: npm ci --prefix "$CENSUS_RUNTIME" --ignore-scripts --omit=dev --no-fund --no-audit
      - name: Build the reviewed binding from its packaged source
        run: npm --prefix "$CENSUS_RUNTIME" run build:native
      - name: Test binary parsing, quantities, properties and immutable input using synthetic databases
        env:
          WORLD_IDS_TESTS: '1'
          OPS_BASE: ${{ runner.temp }}/grilling-census
        run: python3 tools/guards/test_guards.py WorldIds
