name: Canonical release baseline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grilling-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Temporary G210 runtime fingerprint diagnostic
        run: |
          python -c 'import sys;sys.path.insert(0,"tools");from baseline_gate import fingerprint,ROOT,read; cfg=read(ROOT/"baseline.json");print("G210_FINGERPRINT="+str({side:fingerprint(ROOT/relative)[0] for side,relative in cfg["runtime"].items()}))'
      - run: python tools/baseline_gate.py check --release --history-base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Test guards with the frozen G206 QA input
        env:
          SENLUO_QA_G206_ARCHIVE: ${{ runner.temp }}/grilling-g206.mcaddon
        run: |
          curl --fail --location --retry 3 https://github.com/burnt-tea-dev/kaleidoscope-grilling-unofficial/releases/download/A2.8.206/Kaleidoscope_Grilling_Unofficial_2.8.206_baseline1.mcaddon --output "$SENLUO_QA_G206_ARCHIVE"
          python tools/test_baseline_gate.py
