name: Canonical release baseline
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grilling-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/baseline_gate.py check --release
      - run: python tools/test_baseline_gate.py
      - run: python tools/guards/test_guards.py
      - run: python tools/guards/growth_ratchet.py check
