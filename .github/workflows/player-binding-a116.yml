name: Cookery-linked player animation A1.16
on:
  push:
    branches: [main]
    paths:
      - 'development/player_binding/**'
      - 'projects/grilling/integration/immersion_lab/**'
  pull_request:
    paths:
      - 'development/player_binding/**'
      - 'projects/grilling/integration/immersion_lab/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grilling-player-binding-a116
  cancel-in-progress: false
jobs:
  binding:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'burnt-tea-dev/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git remote add origin https://github.com/burnt-tea-dev/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Generate Cookery dependencies, attachables and player animations
        shell: pwsh
        run: |
          python development/player_binding/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run six-profile flow tests
        shell: pwsh
        run: |
          node development/player_binding/test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute main/off-hand adapter in mock event host
        shell: pwsh
        run: |
          node --experimental-vm-modules development/player_binding/test_runtime.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate player binding structure and exact Cookery 1.0.6 dependencies
        shell: pwsh
        run: |
          python development/player_binding/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }
      - name: Compile the A1.16 BP/RP with official Dash
        working-directory: projects/grilling/integration/immersion_lab
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare real Dash output against generated source
        shell: pwsh
        run: |
          python development/player_binding/verify.py --compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package only verified Dash output and authoring project
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json,zipfile,shutil,hashlib,os
          root=Path('.');lab=root/'projects/grilling/integration/immersion_lab';art=root/'artifacts';report=root/'projects/grilling/reports/player_binding_a116'
          art.mkdir(exist_ok=True);report.mkdir(parents=True,exist_ok=True)
          def load(p):return json.loads(p.read_text(encoding='utf-8-sig'))
          packs={}
          for name in ('behavior_pack','resource_pack'):
              source=lab/name;uuid=load(source/'manifest.json')['header']['uuid']
              matches=[p.parent for p in (lab/'builds/dist').rglob('manifest.json') if load(p).get('header',{}).get('uuid')==uuid]
              assert len(matches)==1,(name,matches);packs[name]=matches[0]
          mc=art/'Grilling_Immersion_Lab_A1.16.mcaddon'
          with zipfile.ZipFile(mc,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for name,pack in packs.items():
                  for p in sorted(pack.rglob('*')):
                      if p.is_file():z.write(p,name+'/'+p.relative_to(pack).as_posix())
          with zipfile.ZipFile(mc) as z:assert z.testzip() is None
          br=art/'Grilling_Immersion_Lab_A1.16.brproject'
          with zipfile.ZipFile(br,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(lab.rglob('*')):
                  if p.is_file() and 'builds' not in p.relative_to(lab).parts and '.bridge' not in p.relative_to(lab).parts:z.write(p,p.relative_to(lab).as_posix())
          result={'tested_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'cookery_dependency_verified':True,'dash_compiled_and_compared':True,'mcaddon_sha256':hashlib.sha256(mc.read_bytes()).hexdigest(),'brproject_sha256':hashlib.sha256(br.read_bytes()).hexdigest(),'minecraft_tested':False,'native_contact_tested':False,'left_handed_client_tested':False}
          (report/'ci-result.json').write_text(json.dumps(result,indent=2)+'\n')
          for p in [lab/'builds',lab/'.bridge']:
              if p.exists():shutil.rmtree(p)
          '@ | python -
      - name: Upload A1.16 test packs and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Grilling-Cookery-Player-Binding-A1.16
          path: |
            artifacts/Grilling_Immersion_Lab_A1.16.mcaddon
            artifacts/Grilling_Immersion_Lab_A1.16.brproject
            projects/grilling/reports/player_binding_a116/
          retention-days: 14
          if-no-files-found: error
