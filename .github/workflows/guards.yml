name: Rebuild guards (save compatibility only)

# Every PR checks saved IDs, storage schema and pack identity once.
# Growth metrics and synthetic guard self-tests are release-time diagnostics,
# not gameplay PR blockers.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grilling-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Rebuild guards
    if: github.repository_id == '1377218440'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Keep existing saved IDs, storage and pack UUIDs
        run: python3 tools/guards/save_compat.py check
      - name: Compare against the unchanged base-branch save lock
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_lock="$RUNNER_TEMP/save-compat-base.json"
          if git cat-file -e "$BASE_SHA:tools/guards/save-compat.lock.json" 2>/dev/null; then
            git show "$BASE_SHA:tools/guards/save-compat.lock.json" > "$base_lock"
            python3 tools/guards/save_compat.py check --lock "$base_lock"
          fi
