name: Grilling rebuild CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_legacy_suite:
        description: 'Also run every transitional legacy gameplay test'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: grilling-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse tracked JSON (install-critical data)
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.json' | xargs -0 -r python tools/check_json.py
      - name: Check core player-visible gameplay
        run: python tools/run_tests.py --smoke
      - name: Full legacy regression suite (requested manually, not a PR gate)
        if: github.event_name == 'workflow_dispatch' && inputs.full_legacy_suite
        run: python tools/run_tests.py --full
      - name: Validate current guide icons and loot
        run: |
          python tools/test_guide_icon_regression.py
          python tools/test_fortress_loot_current.py
