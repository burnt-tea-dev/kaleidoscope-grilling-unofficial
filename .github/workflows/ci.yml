name: Grilling rebuild CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grilling-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Java extraction image reader
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tools/fixtures/g66-pillow-linux-requirements.txt
      # guards.yml also compares the PR against the base locks and protects files.
      - name: Check save compatibility and growth ceilings
        run: |
          python tools/guards/test_guards.py
          python tools/guards/save_compat.py check
          python tools/guards/growth_ratchet.py check
      - name: Check unchanged canonical baseline and guard regressions
        run: |
          python tools/baseline_gate.py check
          python tools/test_baseline_gate.py
      - name: Parse every tracked JSON file
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.json' | xargs -0 -r python tools/check_json.py
      - name: Run retained gameplay rules
        run: python tools/run_legacy_tests.py
      - name: Run preserved Java extraction regressions
        run: python tools/test_java_extract.py
