name: Read-only plant preview review
on:
  push:
    paths:
      - '.github/workflows/review-previews.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact public commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'burnt-tea-dev/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git remote add origin https://github.com/burnt-tea-dev/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install image reader
        run: python -m pip install 'Pillow==12.3.0'
      - name: Read the committed pepper contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io
          p=Path('projects/grilling/reports/plants/pepper-parts.png')
          im=Image.open(p).convert('RGB')
          original=hashlib.sha256(p.read_bytes()).hexdigest()
          im.thumbnail((640,480), Image.Resampling.LANCZOS)
          out=io.BytesIO();im.save(out,'WEBP',quality=78,method=6)
          raw=out.getvalue()
          if len(raw)>18000: raise RuntimeError('Preview exceeds transport budget')
          print('SOURCE_SHA256='+original)
          print('PREVIEW_SHA256='+hashlib.sha256(raw).hexdigest())
          print('PREVIEW_B64='+base64.b64encode(raw).decode())
          print('SCOPE=Reduced visual-review copy only, not a pixel-equivalence test')
          PY
