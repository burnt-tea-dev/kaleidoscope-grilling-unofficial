name: One-time public gameplay closeout
on:
  push:
    branches: [integration/public-minimal-closeout-20261104]
    paths: [.github/workflows/closeout-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository_id == '1377218440'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integration/public-minimal-closeout-20261104
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reapply reviewed source with the narrowed oil slot correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, textwrap
          original=subprocess.check_output(['git','show','50b4b576f8a7ec956864b39dd6fdaa741e41681f:.github/workflows/closeout-once.yml']).decode()
          section=original.split('      - name: Apply only reviewed domain changes; preserve historical identities\n',1)[1].split('      - name:',1)[0]
          script=textwrap.dedent(section.split('        run: |\n',1)[1])
          old="[bp+'scripts/oil/oil_machine_runtime.js','tests/legacy/test_oil_transactions.mjs']"
          assert script.count(old)==1
          script=script.replace(old,"['tests/legacy/test_oil_transactions.mjs']")
          correction='''import pathlib
          path=pathlib.Path('projects/grilling/gameplay_core/behavior_pack/scripts/oil/oil_machine_runtime.js')
          text=path.read_text()
          old=""" return {apply(){if(slot>=0)container.setItem(slot,after);else{drop=p.dimension.spawnItem(output,{...p.location,y:p.location.y+.5});if(!drop)throw Error('Oil bucket drop unavailable')}},
            rollback(){if(slot>=0)container.setItem(slot,before);else if(drop)drop.remove()}};"""
          new=""" // The shared slot writer verifies delivery and never rolls back a foreign
           // replacement. Full-inventory drops retain their existing native lifecycle.
           if(slot>=0)return ownedItemStep({read:()=>container.getItem(slot),write:stack=>container.setItem(slot,stack),before,after});
           return {apply(){drop=p.dimension.spawnItem(output,{...p.location,y:p.location.y+.5});if(!drop)throw Error('Oil bucket drop unavailable')},
            rollback(){if(drop)drop.remove()}};"""
          assert text.count(old)==1, 'Oil slot writer changed'
          path.write_text(text.replace(old,new))
          print('Narrow oil fix: verified inventory-slot ownership; existing native drop rollback unchanged')
          '''
          pathlib.Path('/tmp/oil-slot-fix.py').write_text(textwrap.dedent(correction))
          script=script.replace('python tools/baseline_gate.py freeze','python /tmp/oil-slot-fix.py\npython tools/baseline_gate.py freeze')
          subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Existing full gameplay and source checks with compact diagnostics
        run: |
          python - <<'PY'
          import pathlib,subprocess,sys
          commands=[['python','tools/run_tests.py','--full'],['python','tools/guards/save_compat.py','check'],['python','tools/baseline_gate.py','check'],['python','tools/test_guide_icon_regression.py'],['python','tools/test_fortress_loot_current.py']]
          for index,command in enumerate(commands):
              result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              pathlib.Path('/tmp/closeout-'+str(index)+'.log').write_text(result.stdout)
              print('COMMAND',command,'EXIT',result.returncode)
              lines=result.stdout.splitlines()
              if result.returncode:
                  chosen=set()
                  for i,row in enumerate(lines):
                      if 'not ok ' in row or 'FAIL' in row or 'Error' in row:
                          chosen.update(range(max(0,i-2),min(len(lines),i+32)))
                  for i in sorted(chosen)[:200]:print(lines[i])
                  print('\n'.join(lines[-15:]));sys.exit(result.returncode)
              print('\n'.join(lines[-10:]))
          PY
          git ls-files -z -- '*.json' | xargs -0 -r python tools/check_json.py
          git diff --cached --check
      - name: Commit only the tested candidate to its integration branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = integration/public-minimal-closeout-20261104
          git config user.name 'Grilling integration'
          git config user.email 'noreply@users.noreply.github.com'
          git add -A
          git commit -m 'T3.3: integrate public capability, metadata and verified oil slot delivery as G219'
          python tools/baseline_gate.py check --release
          git push origin HEAD:refs/heads/integration/public-minimal-closeout-20261104
          git log -1 --format='%H %T %s'
          git diff --stat origin/main HEAD
      - name: Preserve original test output without author assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-gameplay-closeout-logs
          path: /tmp/closeout-*.log
          if-no-files-found: ignore
          retention-days: 7
