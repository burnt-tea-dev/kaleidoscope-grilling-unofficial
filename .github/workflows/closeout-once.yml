name: One-time public gameplay closeout
on:
  push:
    branches: [integration/public-minimal-closeout-20261104]
    paths: [.github/workflows/closeout-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.repository_id == '1377218440'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Extract exact original failures without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, re
          url='https://api.github.com/repos/burnt-tea-dev/kaleidoscope-grilling-unofficial/actions/jobs/126300036720/logs'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          raw=urllib.request.urlopen(request).read().decode('utf-8-sig')
          lines=[re.sub(r'^\S+Z\s*','',row) for row in raw.splitlines()]
          hits=[i for i,row in enumerate(lines) if row.startswith('not ok ') or row.startswith('FAIL ') or 'AssertionError' in row]
          selected=set()
          for i in hits:
              for k in range(max(0,i-2),min(len(lines),i+34)): selected.add(k)
          print('TOTAL_LOG_LINES',len(lines),'FAILURE_MARKERS',len(hits))
          for i in sorted(selected): print(str(i+1)+': '+lines[i])
          print('\nSUMMARY')
          for row in lines[-100:]:
              if any(t in row for t in ['# tests','# pass','# fail','gameplay','failed','passed']): print(row)
          PY
