name: Verify and add plant assets
on:
  push:
    branches: [main]
    paths:
      - 'development/add_plants.py'
      - 'development/run_plants.py'
      - 'projects/grilling/config/asset_specs.json'
      - 'projects/grilling/source_manifest.json'
      - 'projects/grilling/source_snapshots/**'
      - 'projects/grilling/tools/**'
  pull_request:
    paths:
      - 'development/add_plants.py'
      - 'development/run_plants.py'
      - 'projects/grilling/config/asset_specs.json'
      - 'projects/grilling/source_manifest.json'
      - 'projects/grilling/source_snapshots/**'
      - 'projects/grilling/tools/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grilling-asset-import
  cancel-in-progress: false
jobs:
  plants:
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read exact public commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install deterministic rendering dependencies
        run: python -m pip install 'numpy==2.3.5' 'Pillow==12.3.0'
      - name: Add sources, lower templates, preserve baseline and run eight-view comparisons
        run: python development/run_plants.py
      - name: Upload plant review reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Grilling-Plant-Asset-Review
          path: projects/grilling/reports/plants/
          retention-days: 14
          if-no-files-found: error
