name: Grilling Gameplay Core — Canonical

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gameplay-core*.yml'
      - '.github/g66-test-release-request.json'
      - '.github/release-request.json'
      - '.github/workflows/family-candidate.yml'
      - 'compat/family/**'
      - 'baseline.json'
      - 'projects/grilling/gameplay_core/**'
      - 'development/gameplay_core/**'
      - 'development/tests/**'
      - 'docs/STATUS-A*.md'
      - 'docs/legacy_workflows/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/gameplay-core*.yml'
      - '.github/g66-test-release-request.json'
      - '.github/release-request.json'
      - '.github/workflows/family-candidate.yml'
      - 'compat/family/**'
      - 'baseline.json'
      - 'projects/grilling/gameplay_core/**'
      - 'development/gameplay_core/**'
      - 'development/tests/**'
      - 'docs/STATUS-A*.md'
      - 'docs/legacy_workflows/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate source, or publish archives from a successful run with the same complete Git tree
        type: choice
        options: [validate, publish]
        default: validate
      validated_run_id:
        description: Successful canonical run ID matching the complete main Git tree; required for publish
        type: string
      confirm_tag:
        description: Exact tag from .github/release-request.json; required for publish
        type: string

permissions:
  contents: read

concurrency:
  group: grilling-gameplay-core-canonical-v2-${{ github.ref }}-${{ inputs.mode || 'validate' }}
  cancel-in-progress: true

jobs:
  source:
    # The exact validated Linux Pillow wheel owns all source/PNG byte gates.
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440' && inputs.mode != 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git config gc.auto 0
          git config maintenance.auto false
          git config fetch.writeCommitGraph false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --no-auto-maintenance --depth=1 origin "$EXPECTED_SHA"
          # Several verifiers compare the current files against historical baselines
          # recorded by complete audited historical-source ref inventory. The tree is
          # read straight from the fetched commit, then those commits are fetched
          # too, so a shallow clone still resolves every baseline.
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # Connector snapshots retain selected original source SHA guards via
          # a checksum-pinned pack. This imports evidence without changing refs.
          python tools/source_provenance.py
          BASELINES=$(python tools/historical_source_refs.py list)
          # Batch exact missing source pins so only one fetch updates .git/shallow.
          missing=()
          for baseline in $BASELINES; do
            if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
              missing+=("$baseline")
            fi
          done
          if ((${#missing[@]})); then
            git fetch --no-auto-maintenance --depth=1 origin "${missing[@]}"
          fi
          python tools/historical_source_refs.py verify

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact validated Linux PNG encoder wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r tools/fixtures/g66-pillow-linux-requirements.txt
          python -c "import PIL; from PIL import features; print('Pillow', PIL.__version__, 'PNG zlib', features.version('zlib'), 'zlib-ng', features.version_feature('zlib_ng'))"

      - name: Verify source and publication regression guards
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_source_provenance.py
          python tools/test_historical_source_refs.py
          python development/gameplay_core/test_verify_current.py
          python development/gameplay_core/test_package_current.py
          python development/gameplay_core/test_publish_test_release.py
          python -m unittest discover -s development/tests -p test_snapshot_raw_lore_roundtrip_20261013.py -v

      - name: Verify full canonical source once and record exact inputs
        shell: bash
        run: |
          set -euo pipefail
          python development/gameplay_core/verify_current.py --write-source-validation "$RUNNER_TEMP/grilling-source-validation.json"

      - name: Transfer exact successful functional source receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Kaleidoscope-Grilling-Canonical-Source-Validation
          path: ${{ runner.temp }}/grilling-source-validation.json
          retention-days: 14
          if-no-files-found: error

  canonical:
    needs: source
    # One functional source run serves gameplay and family candidates. Pure
    # adapter regressions do not claim native BDS or human client acceptance.
    if: github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Read exact confirmed repository commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'casama233/kaleidoscope-grilling-unofficial'
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git config core.autocrlf false
          git config core.longpaths true
          git config gc.auto 0
          git config maintenance.auto false
          git config fetch.writeCommitGraph false
          git remote add origin https://github.com/casama233/kaleidoscope-grilling-unofficial.git
          git fetch --no-auto-maintenance --depth=1 origin "$EXPECTED_SHA"
          # Several verifiers compare the current files against historical baselines
          # recorded by complete audited historical-source ref inventory. The tree is
          # read straight from the fetched commit, then those commits are fetched
          # too, so a shallow clone still resolves every baseline.
          git checkout --detach "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          # Connector snapshots retain selected original source SHA guards via
          # a checksum-pinned pack. This imports evidence without changing refs.
          python tools/source_provenance.py
          BASELINES=$(python tools/historical_source_refs.py list)
          # Batch exact missing source pins so only one fetch updates .git/shallow.
          missing=()
          for baseline in $BASELINES; do
            if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
              missing+=("$baseline")
            fi
          done
          if ((${#missing[@]})); then
            git fetch --no-auto-maintenance --depth=1 origin "${missing[@]}"
          fi
          python tools/historical_source_refs.py verify

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned asset-verifier dependency
        shell: pwsh
        run: |
          # Match the PNG encoder used by the frozen G66 source assets.
          python -m pip install Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import PIL; from PIL import features; print('Pillow', PIL.__version__, 'PNG zlib', features.version('zlib'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify source receipt and compiled comparison regression guards
        shell: pwsh
        run: |
          python tools/test_source_provenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_historical_source_refs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/test_verify_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/test_package_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python development/gameplay_core/test_publish_test_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read exact successful Linux functional source receipt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: Kaleidoscope-Grilling-Canonical-Source-Validation
          path: ${{ runner.temp }}

      - name: Reject cross-platform source receipt or HEAD drift before compilation
        shell: pwsh
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0, 'development/gameplay_core'); from verify_current import require_source_validation; require_source_validation(Path(r'$env:RUNNER_TEMP/grilling-source-validation.json'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download checksum-pinned official bridge Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dash=Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $dash
          if ((Get-FileHash $dash -Algorithm SHA256).Hash.ToLower() -ne '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de') { throw 'Dash checksum mismatch' }

      - name: Compile canonical runtime with Dash
        working-directory: projects/grilling/gameplay_core
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare real Dash output with canonical source
        shell: pwsh
        run: |
          python development/gameplay_core/verify_current.py --compiled-only --source-validation "$env:RUNNER_TEMP/grilling-source-validation.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package deterministic review artifacts
        shell: pwsh
        run: |
          python development/gameplay_core/package_current.py --output-dir artifacts/review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload canonical review artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Kaleidoscope-Grilling-Canonical-Review
          path: |
            artifacts/review/
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  publication:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && github.ref == 'refs/heads/main' && github.repository == 'casama233/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
      CONFIRMED_TAG: ${{ inputs.confirm_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require completed Linux and Windows validation for the complete main Git tree
        run: python development/gameplay_core/publish_test_release.py --publication check-run --validation-run "$VALIDATED_RUN_ID" --confirm-tag "$CONFIRMED_TAG"
      - name: Read only the selected canonical review archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: Kaleidoscope-Grilling-Canonical-Review
          path: artifacts/review
          run-id: ${{ inputs.validated_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact archives, stage a draft, read it back and publish the requested release
        run: python development/gameplay_core/publish_test_release.py --publication publish --validation-run "$VALIDATED_RUN_ID" --confirm-tag "$CONFIRMED_TAG"
