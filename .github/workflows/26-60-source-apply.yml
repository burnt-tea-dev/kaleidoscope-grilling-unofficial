name: Apply reviewed 26.60 source delta
on:
  push:
    branches: [feat/26-60-native-work-audio]
    paths: [.github/workflows/26-60-source-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: feat/26-60-native-work-audio
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact owned source changes and advance paired identity
        env:
          PATCH_DATA: >-
            
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1279162e632c7ae3e556c18503adf0919267ced5
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd()
          raw=gzip.decompress(base64.b64decode(os.environ['PATCH_DATA']))
          assert hashlib.sha256(raw).hexdigest()=='a1cf4889779f59fb649defa25653d48d7d86e9d9b101e5b207aa3762f6162365'
          subprocess.run(['git','apply','--check','--unidiff-zero','-'],input=raw,check=True)
          subprocess.run(['git','apply','--unidiff-zero','-'],input=raw,check=True)
          def read(p):return json.loads((root/p).read_text())
          def write(p,v):(root/p).write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          version=[2,8,183];b=read('baseline.json');assert b['version']==[2,8,182]
          assert '2.8.183' not in read('release-history.json')
          b['version']=version;b['required_experiments']={'gametest':True}
          own={v['uuid'] for v in b['packs'].values()}
          for side,folder in b['runtime'].items():
              p=folder+'/manifest.json';m=read(p);m['header']['version']=version;m['header']['min_engine_version']=[1,26,60]
              for module in m['modules']:module['version']=version
              for dep in m.get('dependencies',[]):
                  if dep.get('uuid') in own:dep['version']=version
                  if dep.get('module_name')=='@minecraft/server':dep['version']='2.12.0-beta'
              b['packs'][side]['dependencies']=m.get('dependencies',[]);write(p,m)
          write('baseline.json',b)
          for p in ['config.json','projects/grilling/gameplay_core/config.json']:
              v=read(p);v['name']='Kaleidoscope Grilling 2.8.183 Canonical Baseline';v['targetVersion']='1.26.60';v['experimentalGameplay']={'enableGameTestFramework':True};v['compiler']['plugins'][0][1]['packName']='Kaleidoscope_Grilling_2_8_183_Canonical';write(p,v)
          p=root/'CHANGELOG.md';s=p.read_text();i=s.index('## ')
          s=s[:i]+'## 2.8.183 Bedrock 26.60 native scheduling and audio candidate (unreleased)\n\n- Preserve the merged G182 visual repairs and asset cleanup. Replace oil-press per-tick registry polling with owned named ticks and 20-tick recovery; preserve saved-state keys, loaded-tick progress and item transactions. Startup recovery only arms the next native tick.\n- Native grill audio loop keeps one handle per station and retains extinguish, removal and unloaded-station cleanup. Observer seasoning one-shots are unchanged.\n- Requires Bedrock 26.60 and server 2.12.0-beta / Beta APIs (`gametest=true`). Bridge flags configure the editor only. Source/CI is not client or LIVE acceptance.\n\n'+s[i:];p.write_text(s)
          p=root/'README.md';s=p.read_text();s+='\n26.60 開發候選：**2.8.183／Cookery 1.6.4**，接續已合併 G182；榨油機命名 tick 與烤架原生循環音效。需要 Beta APIs（世界 `gametest=true`），不代表已發布、已部署或真人驗收。\n';p.write_text(s)
          (root/'.github/workflows/26-60-source-apply.yml').unlink()
          PY
          node --test tests/legacy/test_oil_transactions.mjs tests/legacy/test_immersion_audio.mjs
          python3 -m unittest discover -s tools -p test_bridge_project.py
          python3 tools/guards/save_compat.py check
          python3 tools/guards/growth_ratchet.py check
          python3 tools/baseline_gate.py freeze
          git add -A
          git config user.name 'Cary development assistant'
          git config user.email '97009482+casama233@users.noreply.github.com'
          git commit -m 'T3.3: 26.60 native work ticks and grill sound loops (G183)'
          python3 tools/baseline_gate.py check --release --history-base 1279162e632c7ae3e556c18503adf0919267ced5
          git push origin HEAD:refs/heads/feat/26-60-native-work-audio
          git bundle create "$RUNNER_TEMP/grilling-26-60.bundle" HEAD ^f7911448480dd1f3937a6319a581ca30d8fbba74
          git show -s --format='%H %T' HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: grilling-26-60-source-delta
          path: ${{ runner.temp }}/grilling-26-60.bundle
          retention-days: 1
          if-no-files-found: error
