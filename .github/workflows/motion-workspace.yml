name: Motion source workspace
on:
  push:
    paths: ['.github/workflows/motion-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'burnt-tea-dev/kaleidoscope-grilling-unofficial' && github.repository_id == '1377218440'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact project and pinned original source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = '1377218440'
          git init .
          git remote add origin https://github.com/burnt-tea-dev/kaleidoscope-grilling-unofficial.git
          git fetch --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p transfer
          git archive --format=zip HEAD -o transfer/workspace.zip
          curl --fail --location --max-time 90 https://codeload.github.com/breezeth-CN/KaleidoscopeGrilling/zip/9a1acdab27698457bec16c9362678e574895a28c -o transfer/upstream.zip
          sha256sum transfer/*.zip > transfer/SHA256SUMS.txt
      - name: Export source workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-workspace
          path: transfer/
          retention-days: 7
          if-no-files-found: error
